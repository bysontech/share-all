name = "share-photo-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "share-photo-db"
database_id = "a9508efb-3f8d-47e3-a158-b3d683bd228b"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "share-photo-bucket"

[vars]
SIGNED_URL_EXPIRY_UPLOAD = "900"
SIGNED_URL_EXPIRY_VIEW = "3600"
FRONTEND_URL = "https://share-photo.bysontech.jp"
UPLOAD_BODY_SIGNING_SECRET = "local-dev-only-change-in-production"
R2_BUCKET_NAME = "share-photo-bucket"
# HEIC 表示用: オレンジクラウドで /cdn-cgi/image が効く API のオリジン（未設定だと HEIC は URL なし）
IMAGE_TRANSFORMATIONS_ORIGIN = "https://share-photo-api.bysontech.jp"
#現在はテスト用
PUBLIC_WEDDING_ROOM_ID = "40f7fc7f-b833-49b8-a667-f6a2003f5896"
#本番用bk
PUBLIC_WEDDING_ROOM_ID_PRODUCTION = "5f75d656-f453-4125-bacc-c434c20f779f"

[dev]
port = 8787
